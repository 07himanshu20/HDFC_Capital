<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackFund · Fund operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --navy:#0E1C38; --navy-2:#1B2E55; --navy-3:#152648; --navy-ink:#D4DBEA; --navy-mute:#7D8BA7;
  --ink:#131A27; --ink-2:#384255; --mute:#6A7386; --faint:#9AA1AF;
  --line:#E4E7ED; --line-2:#EEF0F4; --bg:#FFFFFF; --bg-2:#F7F8FA; --bg-3:#F0F2F5;
  --accent:#A3162B; --accent-2:#87101F; --accent-soft:#FBEDEF;
  --pos:#0E7A4D; --pos-bar:#17834F; --pos-soft:#E7F4EC;
  --neg:#C42B2B; --neg-bar:#D52A30; --neg-soft:#FCECEC;
  --warn:#B45309; --warn-soft:#FDF3E3; --warn-line:#F2D9A9;
  --blue:#2D5AA6; --teal:#159584; --amber:#E08A2B;
  --z:.8;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{zoom:var(--z)}
@media (max-width:1180px){:root{--z:.88}}
@media (max-width:900px){:root{--z:1}}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.mono{font-family:var(--mono)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--mute)} .faint{color:var(--faint)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:64px 1fr;grid-template-columns:248px 1fr;height:calc(100vh / var(--z));height:calc(100dvh / var(--z))}
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 22px 0 26px;border-bottom:1px solid var(--line);background:#fff;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:-.02em;position:relative}
.brand-mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:3px;background:var(--accent);border:2px solid #fff}
.brand-name{font-size:21px;font-weight:700;letter-spacing:-.03em;color:var(--navy)}
.brand-name b{color:var(--accent);font-weight:700}
.brand-sep{width:1px;height:30px;background:var(--line);margin:0 6px}
.brand-tag{font-size:10.5px;font-weight:600;letter-spacing:.09em;color:var(--mute);line-height:1.35;text-transform:uppercase}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.gsearch{position:relative}
.gsearch input{width:300px;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 36px;background:var(--bg-2);outline:none}
.gsearch input:focus{background:#fff;border-color:#C9CED8}
.gsearch .ic{position:absolute;left:11px;top:10px;color:var(--faint)}
.gsearch kbd{position:absolute;right:9px;top:9px;font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:#fff}
.gs-res{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(14,28,56,.12);padding:6px;display:none;max-height:380px;overflow:auto}
.gs-res.on{display:block}
.gs-res a{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:7px}
.gs-res a:hover,.gs-res a.hl{background:var(--bg-2)}
.gs-res small{color:var(--mute)}
.gs-grp{font-size:11px;color:var(--faint);padding:6px 10px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink-2)}
.icon-btn:hover{background:var(--bg-2)}
.dot-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.menu-btn{display:none}

.side{background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;overflow-y:auto;padding:14px 12px 10px;scrollbar-width:thin;scrollbar-color:#2C3F66 transparent}
.fund-pick{position:relative;margin:0 2px 14px}
.fund-pick select{appearance:none;width:100%;background:var(--navy-3);border:1px solid #263A62;color:#fff;border-radius:10px;padding:10px 32px 10px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.fund-pick small{display:block;font-size:11px;color:var(--navy-mute);margin:0 0 6px 4px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.fund-pick .ic{position:absolute;right:10px;bottom:11px;color:var(--navy-mute);pointer-events:none}
.nav-h{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--navy-mute);padding:16px 12px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--navy-ink);font-size:15px;font-weight:500;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:var(--navy-2);color:#fff;font-weight:600}
.nav a .cnt{margin-left:auto;font-size:11px;font-family:var(--mono);background:rgba(255,255,255,.1);border-radius:6px;padding:1px 6px}
.nav a.on .cnt{background:var(--accent)}
.side-user{margin:10px 12px;background:var(--navy-3);border-radius:12px;padding:12px;display:flex;gap:11px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.side-user .em{font-size:13.5px;color:#fff;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-badge{display:inline-block;margin-top:4px;background:#5C1220;color:#FFD9DE;font-size:10.5px;font-weight:600;letter-spacing:.06em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.signout{display:flex;align-items:center;gap:12px;padding:12px 24px 18px;color:var(--navy-ink);font-size:15px;cursor:pointer}
.signout:hover{color:#fff}

.main{overflow-y:auto;min-width:0;scroll-behavior:auto}
.page{padding:30px 34px 60px;max-width:1440px;margin:0 auto}

/* ---------- page head ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 20px}
.ph-l{display:flex;align-items:center;gap:18px;min-width:0}
.ph-icon{width:46px;height:46px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.09em;color:var(--accent);text-transform:uppercase}
.ph h1{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:3px 0 0;line-height:1.2}
.ph-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.ph.has-tabs .ph-r{flex-basis:100%;flex-wrap:nowrap;min-width:0}
.ph.has-tabs .tabs{min-width:0;flex:0 1 auto}
.detail-in .t td{white-space:nowrap}
.tabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:11px;padding:4px;background:#fff;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{white-space:nowrap;padding:7px 13px;border-radius:8px;color:var(--ink-2);font-size:14.5px;border:1px solid transparent;background:none;cursor:pointer}
.tabs a:hover,.tabs button:hover{color:var(--ink)}
.tabs a.on,.tabs button.on{background:#fff;border-color:var(--line);box-shadow:0 1px 2px rgba(14,28,56,.08);color:var(--ink);font-weight:600}
.tabs.sm a,.tabs.sm button{font-size:13.5px;padding:6px 11px}
.vsep{width:1px;height:30px;background:var(--line)}
.sel{position:relative;display:inline-flex}
.sel select{appearance:none;height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 34px 0 13px;font-size:14.5px;cursor:pointer}
.sel .ic{position:absolute;right:10px;top:11px;pointer-events:none;color:var(--ink-2)}
.sel.sm select{height:34px;font-size:13.5px}
.sel.sm .ic{top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg-2)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.primary:disabled{background:#D8A3AB;border-color:#D8A3AB;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--bg-2)}
.lede{color:var(--ink-2);font-size:15px;margin:14px 0 0 64px;max-width:80ch}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:14.5px;margin:18px 0 0 64px}
.back:hover{color:var(--accent)}
.link{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}

/* ---------- layout ---------- */
.sec{margin-top:26px}
.g{display:grid;gap:20px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.65fr)}
.g31{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}

/* ---------- cards ---------- */
.card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:22px 22px}
.card.flush{padding:0}
.card.flush .card-hd{padding:22px 22px 0}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.card-t{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
.card-s{color:var(--mute);font-size:14px;margin-top:3px;max-width:72ch}
.card-meta{font-family:var(--mono);font-size:13.5px;color:var(--ink-2);white-space:nowrap}

.kpi{border:1px solid var(--line);border-radius:12px;padding:20px 18px 18px;background:#fff;cursor:pointer;text-align:left;transition:border-color .15s}
.kpi:hover{border-color:#C9CED8}
.kpi-l{font-size:12.5px;font-weight:500;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase}
.kpi-v{font-family:var(--mono);font-size:25px;font-weight:600;margin:9px 0 6px;letter-spacing:-.02em;white-space:nowrap}
.kpi-s{font-size:13px;color:var(--mute)}
.strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.strip button{border:0;border-right:1px solid var(--line);background:#fff;padding:14px 14px 13px;text-align:left;cursor:pointer}
.strip button:last-child{border-right:0}
.strip button:hover{background:var(--bg-2)}
.strip .l{font-size:11.5px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.strip .v{font-family:var(--mono);font-weight:600;font-size:16px;margin-top:5px;white-space:nowrap}
.strip .s{font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{font-size:12px;font-weight:500;letter-spacing:.05em;color:var(--ink-2);text-transform:uppercase;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
.t td{padding:13px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.row:hover td{background:#FAFBFC}
.t tr.click{cursor:pointer}
.t .r{text-align:right}
.t .c{text-align:center}
.t td.num,.t td .num{font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.t .nm{font-weight:500;font-size:14.5px}
.t .nm a:hover{color:var(--accent)}
.t .sub{font-size:12.5px;color:var(--mute);margin-top:2px}
.t.compact td{padding:10px 14px}
.t tfoot td{border-top:1px solid var(--line);font-weight:600;background:var(--bg-2)}
.t-pad th:first-child,.t-pad td:first-child{padding-left:22px}
.t-pad th:last-child,.t-pad td:last-child{padding-right:22px}
.expander{width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center;color:var(--ink-2);transition:transform .15s;margin-right:8px;vertical-align:middle}
tr.open .expander{transform:rotate(90deg)}
tr.detail>td{background:#FBFBFC;padding:0;border-bottom:1px solid var(--line)}
tr.detail{display:none}
tr.detail.on{display:table-row}
.detail-in{padding:22px 24px 24px 50px}

.tag{display:inline-block;font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:5px;border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn);vertical-align:middle;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.g{background:var(--pos-soft);color:var(--pos)}
.pill.r{background:var(--neg-soft);color:var(--neg)}
.pill.a{background:var(--warn-soft);color:var(--warn)}
.pill.n{background:var(--bg-3);color:var(--ink-2)}
.pill.b{background:#EAF0FA;color:var(--blue)}
.cur{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:#fff}
.cur i{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;vertical-align:1px}

/* ---------- drivers ---------- */
.drv{display:grid;grid-template-columns:150px 1fr 110px 70px;align-items:center;gap:4px 16px;padding:11px 0}
.drv+.drv{border-top:0}
.drv .dn{font-size:15px;font-weight:500}
.drv .dv{font-family:var(--mono);font-size:13.5px;text-align:right}
.drv .ds{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink-2)}
.drv .dd{grid-column:2/-1;font-size:12.5px;color:var(--mute);margin-top:-4px}
.dtrack{position:relative;height:9px}
.dtrack .ax{position:absolute;left:50%;top:-8px;bottom:-8px;width:1px;background:var(--line)}
.dtrack .bar{position:absolute;top:0;height:9px;border-radius:5px}
.dsimple{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.dsimple .dtop{display:flex;justify-content:space-between;align-items:baseline}
.dsimple .nm{font-size:15px;font-weight:500}
.dsimple .vv{font-family:var(--mono);font-size:13.5px}
.dsimple .tr{height:9px;background:var(--bg-3);border-radius:5px;overflow:hidden}
.dsimple .tr i{display:block;height:100%;border-radius:5px}
.dsimple .ex{font-size:12.5px;color:var(--mute)}
.drv-legend{display:grid;grid-template-columns:150px 1fr 110px 70px;gap:16px;font-size:12.5px;color:var(--mute);padding-bottom:2px}
.drv-legend .lg{display:flex;justify-content:space-between}
.drv-total{border-top:1px solid var(--line);margin-top:6px;padding-top:14px}

/* ---------- allocation ---------- */
.alloc{display:flex;height:11px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 14px}
.alloc i{display:block;height:100%}
.acc-row{border-bottom:1px solid var(--line-2)}
.acc-row:last-child{border-bottom:0}
.acc-h{display:grid;grid-template-columns:18px 1fr auto auto;gap:10px;align-items:center;padding:10px 2px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.acc-h:hover .acc-n{color:var(--accent)}
.acc-h .chev{color:var(--faint);transition:transform .15s}
.acc-row.open .chev{transform:rotate(90deg)}
.acc-n{font-weight:500;font-size:14.5px}
.acc-n small{color:var(--mute);font-weight:400;margin-left:6px}
.acc-v{font-family:var(--mono);font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.acc-p{font-family:var(--mono);font-size:13px;width:52px;text-align:right}
.acc-body{display:none;padding:0 0 12px 28px}
.acc-row.open .acc-body{display:block}
.acc-co{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13.5px}
.acc-co:hover{background:var(--bg-2)}
.acc-co .cn{font-weight:500}
.acc-co .cn small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.acc-foot{padding:6px 10px 0}

/* ---------- misc ---------- */
.banner{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:12px;padding:18px 22px;cursor:pointer}
.banner:hover{border-color:#C9CED8}
.banner .ic.w{color:var(--warn)}
.banner b{font-size:16px;font-weight:600}
.banner p{margin:2px 0 0;color:var(--mute)}
.banner .go{margin-left:auto;color:var(--ink-2)}
.spark{display:block}
.legend{display:flex;justify-content:center;gap:18px;font-size:12.5px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{width:10px;height:10px;border-radius:2px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;height:2px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:11.5px;fill:var(--mute)}
.chart .hov{fill:transparent;cursor:crosshair}
.chart .hov:hover{fill:rgba(14,28,56,.035)}
#tip{position:fixed;z-index:100;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px rgba(14,28,56,.14);padding:10px 12px;font-size:12.5px;display:none;min-width:150px}
#tip .tt{font-weight:600;margin-bottom:5px;font-size:13px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:3px}
#tip .tr span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
#tip .tr i{width:8px;height:8px;border-radius:50%}
#tip .tr b{font-family:var(--mono);font-weight:500}
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel-h{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;margin-bottom:8px}
.roll{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:14px}
.roll span{color:var(--ink-2)}
.roll .num{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink-2)}
.roll .tot{font-weight:600;color:var(--ink);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv .l{font-size:12px;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;font-weight:500}
.kv .v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:4px}
.kv .s{font-size:12.5px;color:var(--mute);margin-top:2px}
.split{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.split:last-child{border-bottom:0}
.split .num{font-family:var(--mono);font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.inp{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 13px;background:#fff;outline:none;min-width:0}
.inp:focus{border-color:#B9BFCB}
.search{position:relative;display:inline-flex}
.search .inp{padding-left:38px;width:300px}
.search .ic{position:absolute;left:12px;top:11px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:#fff}
.seg button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.seg button.on{border-color:var(--line);box-shadow:0 1px 2px rgba(14,28,56,.08);color:var(--ink);font-weight:600}
.note{background:#F2F7FC;border:1px solid #D3E3F3;border-radius:12px;padding:16px 20px;color:#203A5C;font-size:14.5px;line-height:1.55}
.form{border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px;display:none;background:#fff}
.form.on{display:block}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 18px}
.fld label{display:block;font-size:12px;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;font-weight:500;margin-bottom:7px}
.fld .inp,.fld select,.fld textarea{width:100%}
.fld select{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff}
.fld textarea{border:1px solid var(--line);border-radius:9px;padding:10px 13px;min-height:70px;resize:vertical}
.factions{display:flex;gap:14px;align-items:center;margin-top:18px}
.ferr{color:var(--neg);font-size:13px}
.empty{text-align:center;color:var(--mute);padding:34px 20px}
.bar-in{height:7px;background:var(--bg-3);border-radius:4px;overflow:hidden;min-width:70px}
.bar-in i{display:block;height:100%;border-radius:4px}
.hm{display:grid;gap:3px}
.hm div{border-radius:5px;font-size:12px;font-family:var(--mono);display:grid;place-items:center;height:34px;cursor:pointer}
.hm .hh{background:none;color:var(--ink-2);font-family:var(--sans);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;cursor:default;height:auto;padding-bottom:4px}
.hm .rn{justify-content:start;place-items:center start;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink);background:none;padding-right:8px}
.hm .rn:hover{color:var(--accent)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(176px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:200px}
.kcol h4{margin:2px 4px 12px;font-size:13.5px;display:flex;justify-content:space-between;font-weight:600}
.kcol h4 span{font-family:var(--mono);color:var(--mute);font-weight:500}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
.kcard:hover{border-color:#C9CED8}
.kcard b{font-weight:600;font-size:14px}
.kcard .m{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin-top:6px}
.chat{display:grid;grid-template-columns:250px 1fr;border:1px solid var(--line);border-radius:12px;height:620px;overflow:hidden}
.chat-l{border-right:1px solid var(--line);background:var(--bg-2);padding:14px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.chat-l a{padding:9px 11px;border-radius:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-l a.on{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500}
.chat-r{display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow:auto;padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:78%;padding:12px 15px;border-radius:12px;font-size:14.5px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--bg-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a table{margin-top:8px;font-size:13px;border-collapse:collapse}
.msg.a td{padding:3px 12px 3px 0}
.msg.a td:last-child{font-family:var(--mono);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 28px 12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.composer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.composer .inp{flex:1}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:4px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dh{background:var(--bg-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line)}
.cal .d{min-height:96px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:7px 8px;font-size:12px}
.cal .d:nth-child(7n){border-right:0}
.cal .d .n{font-family:var(--mono);color:var(--ink-2);font-size:12px}
.cal .d.x .n{color:var(--faint)}
.cal .d.today .n{background:var(--accent);color:#fff;border-radius:5px;padding:1px 6px}
.cal .ev{display:block;margin-top:4px;padding:3px 6px;border-radius:5px;font-size:11.5px;line-height:1.3;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-f{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;width:100%;border:0;background:none;text-align:left}
.tree-f:hover{background:var(--bg-2)}
.tree-f .chev{transition:transform .15s;color:var(--faint)}
.tree-n.open>.tree-f .chev{transform:rotate(90deg)}
.tree-c{display:none;padding-left:20px}
.tree-n.open>.tree-c{display:block}
.drop{border:1.5px dashed #C5CBD6;border-radius:12px;padding:36px;text-align:center;background:var(--bg-2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#CBD0DA;border-radius:22px;cursor:pointer;transition:.15s}
.switch span::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(16px)}
.range-row{display:grid;grid-template-columns:1fr 110px;gap:4px 14px;align-items:center;margin-bottom:16px}
.range-row label{font-size:13.5px;color:var(--ink-2)}
.range-row output{font-family:var(--mono);text-align:right;font-weight:600}
.range-row input{grid-column:1/-1;accent-color:var(--accent);width:100%}
.hash{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.ring{display:block}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(14,28,56,.32);z-index:60;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:#fff;z-index:61;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(14,28,56,.14)}
.drawer.on{transform:none}
.drawer-h{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.drawer-b{padding:20px 24px;overflow:auto;flex:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);opacity:0;pointer-events:none;width:min(760px,94vw);max-height:88vh;background:#fff;border-radius:14px;z-index:61;display:flex;flex-direction:column;transition:.18s;box-shadow:0 24px 60px rgba(14,28,56,.22)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal-b{padding:24px 26px;overflow:auto}
.notif{position:absolute;top:46px;right:0;width:380px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(14,28,56,.14);display:none;z-index:40}
.notif.on{display:block}
.notif-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.notif a{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:13.5px}
.notif a:hover{background:var(--bg-2)}
.notif a .d{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.notif a.read .d{background:transparent}
.notif small{color:var(--mute);display:block;margin-top:2px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:90;pointer-events:none;display:flex;align-items:center;gap:10px}
#toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.stmt td{padding:9px 14px}
.stmt .h td{font-weight:600;background:var(--bg-2);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.stmt .tot td{font-weight:600;border-top:1px solid var(--line)}
.stmt .ind td:first-child{padding-left:30px}

@media (max-width:1280px){
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .strip button:nth-child(4){border-right:0}
  .strip button:nth-child(-n+4){border-bottom:1px solid var(--line)}
}
@media (max-width:1100px){
  .g21,.g12,.g31{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gsearch input{width:220px}
}
@media (max-width:900px){
  .ph.has-tabs .ph-r{flex-wrap:wrap;justify-content:flex-start}
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:64px;left:0;bottom:0;width:270px;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .side.on{transform:none}
  .menu-btn{display:grid}
  .brand-sep,.brand-tag{display:none}
  .page{padding:22px 16px 50px}
  .lede,.back{margin-left:0}
  .g3,.g2{grid-template-columns:1fr}
  .chat{grid-template-columns:1fr}.chat-l{display:none}
  .gsearch{display:none}
}
@media (max-width:600px){
  .g4,.g5{grid-template-columns:1fr 1fr}
  .strip{grid-template-columns:1fr 1fr}
  .strip button{border-bottom:1px solid var(--line)}
  .fgrid{grid-template-columns:1fr}
  .drv,.drv-legend{grid-template-columns:110px 1fr 90px}
  .drv .ds,.drv-legend>:last-child{display:none}
  .kpi-v{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .side,.top,.ph-r,.toolbar,.btn,.tabs{display:none!important}
  .app{display:block;height:auto}.main{overflow:visible}
  .card,.kpi{break-inside:avoid}
}

/* ---------- deep-dive dropdowns ---------- */
.t .xcol{width:34px;padding-right:0!important}
.t-pad th.xcol,.t-pad td.xcol{padding-left:16px!important}
tr.xr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tr.xr.open>td{background:#FBF6F7}
tr.xr.open>td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.detail>td{background:linear-gradient(180deg,#FBF6F7 0,#FCFCFD 40px)}
.detail-in{padding:6px 22px 24px 50px;animation:dd .22s ease}
@keyframes dd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
td[data-metric]{cursor:pointer;position:relative}
td[data-metric]:hover{background:#F4F0F1!important;box-shadow:inset 0 -2px 0 var(--accent)}
td[data-metric].mon{background:#F6E9EC!important;box-shadow:inset 0 -2px 0 var(--accent)}
.deep{border:1px solid #EADDE0;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 6px 24px rgba(91,18,32,.06)}
.deep-h{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-2);background:linear-gradient(90deg,#FFF 0,#FBF6F7 100%);flex-wrap:wrap}
.deep-h .ttl{display:flex;gap:12px;align-items:center}
.deep-h .ttl .ph-icon{width:38px;height:38px;border-radius:10px}
.deep-h b{font-size:16px;font-weight:600}
.deep-h small{display:block;color:var(--mute);font-size:12.5px;margin-top:1px}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--bg-3);color:var(--ink-2);white-space:nowrap}
.chip.r{background:var(--neg-soft);color:var(--neg)}.chip.g{background:var(--pos-soft);color:var(--pos)}.chip.a{background:var(--warn-soft);color:var(--warn)}.chip.b{background:#EAF0FA;color:var(--blue)}.chip.k{background:var(--accent-soft);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));border-bottom:1px solid var(--line-2)}
.tile{padding:14px 18px;border-right:1px solid var(--line-2)}
.tile:last-child{border-right:0}
.tile .l{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:500}
.tile .v{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:4px;white-space:nowrap}
.tile .s{font-size:12px;color:var(--faint);margin-top:2px}
.deep-g{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0}
.deep-g>div{padding:16px 20px}
.deep-g>div+div{border-left:1px solid var(--line-2)}
.deep-g.one{grid-template-columns:1fr}
.deep-g.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.deep-f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 20px;border-top:1px solid var(--line-2);background:var(--bg-2);font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.deep-f .acts{display:flex;gap:8px;flex-wrap:wrap}
.src{display:inline-flex;align-items:center;gap:6px}
.src code{font-family:var(--mono);font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-2)}
.mini-h{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:0 0 10px}
.steps{display:flex;flex-direction:column;gap:0;position:relative;margin-left:6px}
.step{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding:0 0 14px;position:relative;font-size:13.5px}
.step:not(:last-child)::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line)}
.step i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:#fff;margin-top:3px;z-index:1}
.step.done i{background:var(--pos-bar);border-color:var(--pos-bar)}
.step.now i{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px rgba(224,138,43,.18)}
.step.late i{background:var(--neg-bar);border-color:var(--neg-bar)}
.step small{color:var(--mute);display:block;font-size:12px}
.step .d{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.qstrip{position:relative;height:46px;margin:8px 0 26px}
.qstrip .rail{position:absolute;left:0;right:0;top:18px;height:10px;border-radius:6px;background:linear-gradient(90deg,#F6C2A8 0,#FBE9C7 33%,#CFE9D9 66%,#9AD3B4 100%)}
.qstrip .tk{position:absolute;top:30px;font-size:11px;color:var(--mute);transform:translateX(-50%);white-space:nowrap;font-family:var(--mono)}
.qstrip .tk::before{content:"";position:absolute;left:50%;top:-14px;width:1px;height:12px;background:#B8BEC9}
.qstrip .me{position:absolute;top:4px;transform:translateX(-50%);text-align:center}
.qstrip .me b{display:block;font-size:11px;font-family:var(--mono);background:var(--accent);color:#fff;border-radius:5px;padding:1px 6px;white-space:nowrap}
.qstrip .me i{display:block;width:2px;height:18px;background:var(--accent);margin:0 auto}
.checklist .ci{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.checklist .ci:last-child{border-bottom:0}
.checklist .ci .b{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;flex:none;color:#fff}
.checklist .ci .b.y{background:var(--pos-bar)}.checklist .ci .b.n{background:#fff;border:1.5px solid #C5CBD6}.checklist .ci .b.w{background:var(--amber)}
.hbar{display:grid;grid-template-columns:130px 1fr 74px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hbar .tr{height:8px;background:var(--bg-3);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:4px}
.hbar .v{font-family:var(--mono);font-size:12.5px;text-align:right}
.flag{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);border:1px solid var(--warn-line);font-size:13px;color:#6B3A07;margin-top:10px}
.flag.r{background:var(--neg-soft);border-color:#F2C4C4;color:#7A1C1C}
.flag.b{background:#EEF3FB;border-color:#C9D7EE;color:#1E3F78}
.asof{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:var(--bg-2);font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.asof b{font-family:var(--mono);color:var(--ink);font-weight:600}
/* ---------- reports ---------- */
.modal.wide{width:min(1000px,96vw);max-height:94vh}
.modal.wide .rp-wrap{flex:1;min-height:0}
.rp-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:#fff;border-radius:14px 14px 0 0;flex-wrap:wrap}
.rp-bar b{font-size:17px}
.rp-wrap{background:#E9ECF1;padding:26px;overflow:auto;border-radius:0 0 14px 14px}
.rp{width:794px;max-width:100%;min-height:1123px;margin:0 auto 24px;background:#fff;box-shadow:0 8px 28px rgba(14,28,56,.12);display:flex;flex-direction:column;font-size:12.5px;color:var(--ink)}
.rp-h{display:flex;align-items:center;gap:12px;padding:22px 40px 16px;border-bottom:2px solid var(--navy)}
.rp-h .brand-mark{width:30px;height:30px;font-size:12px;border-radius:8px}
.rp-h b{font-size:14px}.rp-h small{display:block;color:var(--mute);font-size:11px}
.rp-h .rp-d{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right}
.rp-b{padding:22px 40px;flex:1}
.rp-b h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.rp-b h3{font-size:13.5px;margin:20px 0 8px;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:5px}
.rp-b p{line-height:1.6;margin:8px 0}
.rp-b .lead{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.rp-b table{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0 4px}
.rp-b th{text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1.5px solid var(--ink);padding:5px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.rp-b td{padding:5px 6px;border-bottom:1px solid var(--line-2)}
.rp-b td.n,.rp-b th.n{text-align:right;font-family:var(--mono)}
.rp-b tr.tot td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:0}
.rp-b .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.rp-b .kp div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.rp-b .kp small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.rp-b .kp b{font-family:var(--mono);font-size:16px;display:block;margin-top:3px}
.rp-b .two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rp-b .note{font-size:11.5px;padding:10px 12px}
.rp-b .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
.rp-b .sig div{border-top:1px solid var(--ink);padding-top:6px;font-size:11px;color:var(--ink-2)}
.rp-f{display:flex;justify-content:space-between;padding:12px 40px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mute)}
.rp .chart text{font-size:10px}
/* ---------- ERP ---------- */
.erp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.erp{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}

.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;margin:6px 0 4px}

.pipe .pn:not(:last-child)::after{content:"";position:absolute;top:22px;left:calc(50% + 26px);right:calc(-50% + 26px);height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 11px);animation:flow 1.2s linear infinite;background-size:22px 2px}

.pipe .pn b{font-size:13px;display:block}.pipe .pn small{font-size:11.5px;color:var(--mute)}
.wiz-steps{display:flex;gap:6px;margin-bottom:18px}
.wiz-steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.wiz-steps span.on{background:var(--accent)}

/* ---------- consolidation run ---------- */
.modal.run{width:min(1080px,96vw);max-height:94vh}
.run-h{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 26px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fff,#FBF6F7)}

.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}

.seg button{font:inherit}

.empty-state h2{font-size:22px;margin:0 0 8px}.empty-state p{color:var(--mute)}

<script>

/* ---------- period and people helpers ---------- */
const PER=()=>M().period,PL=()=>PER().label,NV=()=>((st.navv||{})[st.s]||{}).version||1;
const QE=()=>dt(PER().end),QO=()=>dt(PER().open),QS=()=>new Date(PER().start+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const QEs=()=>new Date(PER().end+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const QM15=()=>dt(new Date(new Date(PER().end+'T00:00:00').getTime()-15*864e5).toISOString().slice(0,10));
const NQ=()=>{const m=PER().code.match(/Q(\d)FY(\d+)/);if(!m)return 'the next quarter';const q=+m[1]%4+1,y=+m[2]+(+m[1]===4?1:0);return `Q${q} FY${String(y).padStart(2,'0')}`};
const RN=r=>(ROLES.find(x=>x[0]===r)||[0,'—'])[1],MK=()=>((st.navv||{})[st.s]||{}).submitted_by||RN('FIN_MAKER'),CK=()=>((st.navv||{})[st.s]||{}).approved_by||RN('FIN_CHECKER');
const BND=()=>{const b=S().obligations.find(o=>/breach notice/i.test(o.title));return b?b.due:null};
const ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  trend:'<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',
  building:'<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/>',
  coins:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.4 3.4-5.5 6.5-5.5s5.7 2.1 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  upload:'<path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  file:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/>',
  doc:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>',
  warn:'<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/>',
  right:'<path d="M9 6l6 6-6 6"/>', down:'<path d="M6 9l6 6 6-6"/>',
  left:'<path d="M19 12H5M11 6l-6 6 6 6"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  logout:'<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/>',
  check:'<path d="M5 12l5 5L20 7"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  print:'<path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>'
};
const ic = (n, s = 18, sw = 1.8) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

const $=s=>document.querySelector(s), chev='';
let ROLES=[['PO','—','Principal Officer'],['CRO','—','Chief Risk Officer'],['FIN_MAKER','—','Finance maker'],['FIN_CHECKER','—','Finance checker'],['AML_PO','—','AML officer'],['IR','—','Investor relations'],['INV_TEAM','—','Investment team'],['TRUSTEE_RO','—','Trustee (read + approve)'],['AUDITOR_RO','—','Auditor (read only)']];
const st={s:'A',v:'home',role:'',clock:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),nav:{},navv:{},tab:{},jf:'ALL',audit:[],reports:[],str:[],appr:{},ing:false,mapOk:{},valOk:{},notice:{},regrep:{}};
const S=()=>DATA.schemes[st.s], M=()=>S().meta, isA=()=>st.s==='A';
const f=(x,d=4)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(x,d=4)=>x<0?`<span class="neg">(${f(-x,d)})</span>`:f(x,d);
const U=()=>M().unit, cu=x=>`${isA()?'USD':'₹'} ${f(x)}${isA()?'m':' cr'}`;
const full=x=>(isA()?'USD ':'INR ')+Number(Math.round(x*M().scale*100)/100).toLocaleString(isA()?'en-US':'en-IN',{minimumFractionDigits:2});
const dt=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const days=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const pill=(t,c='')=>`<span class="pill ${c||"n"}">${t}</span>`, tag=t=>`<span class="chip">${t}</span>`;
const sum=(a,fn)=>a.reduce((t,x)=>t+fn(x),0), glName=g=>DATA.gl[g][0];
const inv=id=>S().investors.find(i=>i.id===id), short=n=>n.replace(/ \(.*\)/,'').replace(/(,? Ltd\.?| K\.K\.| LLC| Co\. Ltd| Pvt Ltd)$/,'');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const role=()=>ROLES.find(r=>r[0]===st.role)||[st.role,ME?ME.full_name:'',ME?ME.role_label:st.role];
/* access: the server sends only the data of the pages this role can open; these helpers hide what the role cannot use */
const CAN=p=>!!ACC&&ACC.pages.includes(p), CANDO=a=>!!ACC&&ACC.actions.includes(a);
const SACT={navsubmit:1,navlock:1,valok:1,trypost:1,apprbank:1,obl:1,str:1,strnext:1,mapok:1,notice:1,gen:1,ack:1,verify:1};
const allowed=(act,arg)=>SACT[act]?CANDO(act):(act==='go'||act==='gsgo')?CAN(arg):act==='recon'?CAN('ingestion'):act==='upload'?CANUP:act==='delfiles'?CANDEL:true;
const canObl=b=>CANDO('obl')&&(ME.is_admin||st.role==='PO'||({CO:'PO'}[b.owner]||b.owner)===st.role);
function hash(s){let h=2166136261,g=5381;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),16777619);g=(g*33)^s.charCodeAt(i)}return (h>>>0).toString(16).padStart(8,'0')+(g>>>0).toString(16).padStart(8,'0')}
function log(){} /* audit events are written by the server */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3200)}

/* staged progress for a zip upload: the bar runs for T seconds while the server works (usually 1-3 s), the real log lines appear
   as it advances, and the dashboard refreshes only at 100%. A failure stops the bar at the stage where it happened. */
const UPSTAGES=[['Zip extracting','Unpacking the archive and checking every file',10],['Classifying sheets','Recognising each file by its name and type',24],
 ['Mapping','Mapping each file\'s headers to the fund schema',38],['Extracting data safely','Reading the figures; a SHA-256 is kept for every file',60],
 ['Cross check and validation','Posting the books and running the control checks',82],['Importing to dashboard','Saving the run and refreshing every view',97],['Finished','',100]];
function upFailStage(msg){msg=String(msg||'');return /zip|archive|exceeds|too many/i.test(msg)?0:/missing required|recogni[sz]ed|choose the scheme/i.test(msg)?1:/locked/i.test(msg)?4:3}
function upProgress(T,showLog,done){const box=$('#upprog'),bar=$('#upbar'),bi=bar.firstElementChild,lis=[...$('#upsl').children],lbl=$('#upst'),pc=$('#uppc');
 box.style.display='block';bar.className='pbar';const t0=performance.now();let res=null,p=0,over=false,closed=false,ff=null;
 const stageOf=v=>{const i=UPSTAGES.findIndex(s=>v<s[2]);return i<0?6:i};
 const paint=(cur,state)=>{bi.style.width=p.toFixed(1)+'%';pc.textContent=Math.floor(p)+'%';lis.forEach((li,i)=>li.className=i<cur?'ok':i===cur?(state||'on'):'');
  lbl.textContent=state==='bad'?`Stopped at: ${UPSTAGES[cur][0]}. Nothing was changed.`:UPSTAGES[cur][0]+(cur<6?'…':'')};
 const tick=()=>{if(over)return;if(!document.body.contains(box)){over=closed=true;if(res)done(res);return}
  const f=Math.min(1,(performance.now()-t0)/1000/T);let target=100*(f+0.025*Math.sin(f*Math.PI*6)*(1-f));
  if(res&&res.status!=='succeeded'){
   if(!ff){const fs=Math.max(upFailStage(res.error),stageOf(p)),a=fs?UPSTAGES[fs-1][2]:0;ff={fs,from:p,to:Math.max(p,a+(UPSTAGES[fs][2]-a)*.4),t:performance.now()}}
   const k=Math.min(1,(performance.now()-ff.t)/1200);p=ff.from+(ff.to-ff.from)*k;
   if(k>=1){over=true;paint(ff.fs,'bad');bar.classList.add('fail');showLog(res.log);done(res);return}
   paint(stageOf(p));return setTimeout(tick,60)}
  if(!res)target=Math.min(target,96);
  p=Math.max(p,target);
  if(res&&f>=1){over=true;p=100;paint(6,'ok');bar.classList.add('done');showLog(res.log);setTimeout(()=>done(res),500);return}
  if(res&&res.log)showLog(res.log,Math.max(1,Math.ceil(res.log.length*Math.min(1,p/97))));
  paint(stageOf(p));setTimeout(tick,60)};
 tick();
 return {result(r){res=r;if(closed)done(r)}}}

 if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-x]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='wfs'){$('#wfp').textContent='+'+e.target.value+'%';$('#wfo').innerHTML=wfOut(+e.target.value)}
 if(e.target.id==='gs'){const q=e.target.value.trim().toLowerCase(),R=$('#gsr');if(!q){R.classList.remove('on');return}
  const res=[...MYNAV().flatMap(([g,it])=>it.map(([k,l])=>[l,g,k])),...(CAN('investors')&&S().investors||[]).map(i=>[i.id+' '+i.name,'Investor','investors']),...(CAN('instruments')&&S().instruments||[]).map(x=>[x.id+' '+x.spv_name,'Instrument','instruments']),...(CAN('ledger')&&S().journals||[]).map(j=>[j.no+' '+j.desc,'Journal','ledger'])].filter(x=>x[0].toLowerCase().includes(q)).slice(0,9);
  R.innerHTML=res.length?res.map(([l,g,k])=>`<a data-act="gsgo" data-arg="${k}"><span>${esc(l)}</span><small>${g}</small></a>`).join(''):'<div class="gs-grp">No matches</div>';R.classList.add('on')}});
ACT.gsgo=a=>{$('#gs').value='';$('#gsr').classList.remove('on');location.hash=a};
$('#clock').addEventListener('change',e=>{if(e.target.value){st.clock=e.target.value;render()}});
function route(){if(!DATA)return;const h=location.hash.slice(1);st.v=V[h]&&CAN(h)?h:'home';if(h&&h!==st.v)history.replaceState(null,'','#'+st.v);render.keep=false;render();$('#side').classList.remove('on')}
window.addEventListener('hashchange',route);
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#dropz')){e.preventDefault()}});
document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('#dropz')){e.preventDefault();uploadModal()}});
/* ---------- server ---------- */
let ME=null,BRAND={},RUN=null,CANUP=false,ACC=null,CANDEL=false,UPSEC=20;
async function API(path,opt={}){const h={'X-Requested-With':'trackfund',...(opt.headers||{})};if(opt.body&&typeof opt.body==='string')h['Content-Type']='application/json';
 const r=await fetch(path,{credentials:'same-origin',...opt,headers:h});let j=null;try{j=await r.json()}catch(e){}
 if(r.status===401&&!path.startsWith('/api/auth/login')){showLogin();throw new Error('Please sign in again.')}
 if(!r.ok)throw new Error(j&&Array.isArray(j.detail)?j.detail.map(d=>d.msg).join('; '):(j&&j.detail)||('Error '+r.status));return j}
const post=(p,b)=>API(p,{method:'POST',body:JSON.stringify(b||{})});
function applyState(x){['nav','navv','reports','str','appr','mapOk','valOk','notice','audit','regrep'].forEach(k=>st[k]=x[k]||(k==='regrep'?{}:x[k]));runsCard.data=null}
async function doAct(name,arg){try{const r=await post('/api/actions/'+name,{scheme:st.s,arg:arg==null?null:String(arg),clock:st.clock});applyState(r.state);if(r.data)DATA=r.data;render();toast(r.message);return r}catch(e){toast(e.message);return null}}
function showLogin(){$('#login').classList.add('on');setTimeout(()=>$('#lu').focus(),50)}
$('#loginf').addEventListener('submit',async e=>{e.preventDefault();$('#lerr').textContent='';try{await post('/api/auth/login',{username:$('#lu').value,password:$('#lp').value});$('#lp').value='';$('#login').classList.remove('on');await loadAll()}catch(err){$('#lerr').textContent=err.message}});
function emptyPage(){$('#nb').style.display='none';$('#notif').innerHTML='';$('#main').innerHTML=`<div class="page"><div class="empty-state"><h2>No quarter loaded yet</h2><p>Upload the quarter's source files as one zip: a folder per scheme (<code>scheme_A_…</code>, <code>scheme_B_…</code>) and <code>shared/</code> with the locked opening balances.</p>${CANUP?btn('Upload files','upload','p'):'<p class="muted">Ask the finance maker to upload the files.</p>'}</div></div>`;
 $('#side').innerHTML='';$('#uchip').innerHTML=`<span class="uc-t"><b>${esc(ME.full_name)}</b><small>${role()?role()[2]:ME.role}</small></span>`;$('#umenu').innerHTML=`<button class="um-i" data-act="logout" role="menuitem">Sign out</button>`}
async function loadAll(){const d=await API('/api/dashboard');ME=d.user;ACC=d.user.access;BRAND=d.brand||{};RUN=d.run;CANUP=d.can_ingest;CANDEL=!!d.can_delete;UPSEC=d.upload_progress_s??20;adminData.loaded=false;ROLES=d.directory;st.role=ME.role;applyState(d.state);DATA=d.data;
 $('#brandtag').innerHTML=esc(BRAND.client_label||'').replace(' · ','<br>');
 if(!DATA){emptyPage();return}
 if(!DATA.schemes[st.s])st.s=Object.keys(DATA.schemes)[0];route()}
$('#clock').value=st.clock;
API('/api/auth/me').then(loadAll).catch(()=>showLogin());

</script>
